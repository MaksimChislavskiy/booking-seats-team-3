[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
# Правила, которые хотите включить/отключить
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.format]
quote-style = "single"
trailing-comma = "all"
indent-width = 4